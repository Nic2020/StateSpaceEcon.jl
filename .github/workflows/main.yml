name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run for the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write  # lets julia-actions/cache delete old caches

jobs:
  build:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}${{ matrix.experimental && ' (allowed to fail)' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # The prerelease job is an early warning only; it does not fail the run.
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        julia-version: ["lts", "1.12", "1"]
        os: [ubuntu-latest, windows-latest, macos-latest]
        experimental: [false]
        include:
          - julia-version: "pre"
            os: ubuntu-latest
            experimental: true

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          show-versioninfo: true

      - uses: julia-actions/cache@v3

      # Fixes to StateSpaceEcon often need unreleased fixes in TimeSeriesEcon or
      # ModelBaseEcon. On a pull request, if the GitHub account that owns the PR
      # branch also has a branch with the same name in TimeSeriesEcon.jl or
      # ModelBaseEcon.jl, test against that branch. Otherwise, and on master,
      # use the registered versions. The job summary says which was used.
      - name: Use sibling branches with the same name
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          BRANCH: ${{ github.head_ref }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          urls=""
          for pkg in TimeSeriesEcon ModelBaseEcon; do
            url="https://github.com/$OWNER/$pkg.jl"
            if git ls-remote --exit-code --heads "$url" "$BRANCH" > /dev/null 2>&1; then
              echo "- $pkg: branch \`$BRANCH\` of $url" >> "$GITHUB_STEP_SUMMARY"
              urls="$urls $url"
            else
              echo "- $pkg: registered version" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ -n "$urls" ]; then
            SIBLING_URLS="$urls" julia --color=yes --project=. -e '
              using Pkg
              Pkg.add([PackageSpec(url=u, rev=ENV["BRANCH"]) for u in split(ENV["SIBLING_URLS"])])'
          fi

      - uses: julia-actions/julia-runtest@v1
        with:
          depwarn: error

      - uses: julia-actions/julia-processcoverage@v1

      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
